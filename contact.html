<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Contact - AJ&KaY</title>
</head>
<body>
  <header>
    <h1>AJ&KaY</h1>
    <p>Feminine Jewelry for Every Story</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Contact Us</h2>
      <p>Have a question about an order or custom piece? We'd love to hear from you.</p>
      
      <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="interest">I am interested in:</label>
        <select id="interest" name="interest">
          <option value="everyday">Everyday Glow</option>
          <option value="bridal">Bridal Elegance</option>
          <option value="custom">Custom Piece</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 AJ&KaY Jewelry. All rights reserved. | <a href="mailto:hello@ajkay.com">Email us at hello@ajkay.com</a></p>
  </footer>
</body>
</html>
